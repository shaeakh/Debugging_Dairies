name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
      - dev

env:
  IMAGE_NAME: debugging-diaries-api
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Authenticate with Azure using credentials
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Log in to Azure Container Registry (ACR)
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 4. Set environment variables dynamically based on the current branch
      - name: Set deployment variables
        id: vars
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "APP_NAME=${{ secrets.CONTAINER_APP_NAME }}" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=prod-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "APP_NAME=${{ secrets.CONTAINER_APP_NAME_DEV }}" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      # 5. Build the Docker image and push it to ACR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.IMAGE_TAG }}

      # 6. Deploy the newly pushed image to Azure Container Apps
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ steps.vars.outputs.APP_NAME }}
          containerAppEnvironment: ${{ secrets.CONTAINER_APP_ENV }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.IMAGE_TAG }}
          registryUrl: ${{ secrets.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          targetPort: 3000
          ingress: external
          environmentVariables: >
            PORT=${{ secrets.PORT }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DIRECT_URL=${{ secrets.DIRECT_URL }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            NODE_ENV=${{ github.ref_name == 'main' && 'production' || 'development' }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            FRONTEND_URL1=${{ secrets.FRONTEND_URL1 }}
            FRONTEND_URL2=${{ secrets.FRONTEND_URL2 }}
            FRONTEND_URL_TEST=${{ secrets.FRONTEND_URL_TEST }}
            BACKEND_URL=${{ secrets.BACKEND_URL }}
            AI_MODEL=${{ secrets.AI_MODEL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}

      # 7. Cleanup old ACR images (keep the latest 3, delete the rest)
      - name: Cleanup old ACR images
        run: |
          TAGS=$(az acr repository show-tags \
            --name debuggingdiariesacr \
            --repository ${{ env.IMAGE_NAME }} \
            --orderby time_asc \
            --output tsv)

          TOTAL=$(echo "$TAGS" | wc -l)
          DELETE_COUNT=$((TOTAL - 3))

          if [ "$DELETE_COUNT" -gt 0 ]; then
            echo "$TAGS" | head -n "$DELETE_COUNT" | while read TAG; do
              echo "Deleting tag: $TAG"
              az acr repository delete \
                --name debuggingdiariesacr \
                --image ${{ env.IMAGE_NAME }}:$TAG \
                --yes || true
            done
          else
            echo "Nothing to delete. Total tags: $TOTAL"
          fi
